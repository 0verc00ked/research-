        - article [ref=e81]:
          - generic [ref=e84]:
            - heading "IVCA - Indian Venture and Alternate Capital Association" [level=2] [ref=e85]
            - paragraph [ref=e86]: Established in 1993, the Indian Venture and Alternate Capital Association (IVCA) is a non-profit organization that serves as the apex industry body dedicated to promoting the alternate capital industry and nurturing a thriving investment environment in India. IVCA is resolutely committed to bolstering the ecosystem by advocating regulatory interventions and facilitating constructive dialogue with the Government of India, policymakers, and regulators. This collaborative approach fosters increased entrepreneurial activity, innovation, job creation, and contributes to positioning India as a leading global fund management hub.
            - paragraph [ref=e87]: With over 490 members and a combined AUM exceeding $350 billion, IVCA’s esteemed membership comprises the most active domestic and global entities, including VCs, PEs, Infrastructure Funds, Real Estate Funds, Credit Funds, Limited Partners, Investment Companies, Family Offices, Corporate VCs, Category III Funds / Hedge Funds, and Knowledge Partners.
            - paragraph [ref=e88]: Within the SEBI-registered AIF landscape, 49% of all registered AIFs are IVCA members. Within the total IVCA membership base, 74% of members manage AIFs. IVCA stands as the sole industry association for alternate capital funds engaged in investments within India and is collectively owned by industry members.
            - paragraph [ref=e89]: IVCA holds legal registration as a Section 8 entity, signifying a non-profit organization. Vistra ITCL (India) Limited serves as the custodian of IVCA’s trust-held shares.
            - 'button "IVCA: Brief Profile" [ref=e91] [cursor=pointer]':
              - generic [ref=e92]: "IVCA: Brief Profile"
              - img [ref=e94]
        - img "dots" [ref=e99]
      - main [ref=e100]:
        - article [ref=e101]:
          - heading "Vision and Mission" [level=2] [ref=e102]
          - paragraph [ref=e103]: As we commemorate 75 years of India's sovereignty, the 'India Opportunity' narrative is echoing on the global stage. At IVCA, our vision is not only about fostering a vibrant investing ecosystem, but also pivoting towards the ideals of 'Atmanirbhar Bharat' (self-reliant India). This vision aligns with our goals to onshore the offshore initiatives and underscores the importance of creating domestic pools of capital. It is the robust contributions and unwavering support of diverse asset classes that are instrumental in catalysing India's ambitious objective to ascend as a USD 5 trillion economy by 2025 and bolster India's stature as an enticing destination for both global and domestic funds.
          - paragraph [ref=e104]: To actualize this vision, we have set tangible objectives. We aim to mobilize pools of capital, create a favourable regulatory environment, and drive positive change for the industry. This involves creation of dialogue platforms and opportunities for the Alternate Capital ecosystem which are focused on the promotion of best investment governance practices, research driven advocacy with regulators to provide inputs that enable a competitive policy environment, and networking opportunities between investors and high growth companies.
          - paragraph [ref=e105]: Investor protection and enablement of free and fair markets is core to the associations thought process and we strive to achieve the same via all activities and initiatives that we carry out.
