        - heading "CCI approves proposed transaction involving Aster DM Healthcare, BCP Asia, Centella and Quality Care India Limited" [level=2] [ref=e13]
        - heading [level=3]
      - generic [ref=e14]: "प्रविष्टि तिथि: 15 APR 2025 8:06PM by PIB Delhi"
      - paragraph [ref=e16]:
        - generic [ref=e17]: The
        - generic [ref=e19]: Competition Commission of India has approved
        - generic [ref=e20]: the proposed transaction involving Aster DM Healthcare, BCP Asia, Centella and Quality Care India Limited.
      - paragraph [ref=e21]:
        - generic [ref=e23]: The proposed transaction includes the proposed merger of
        - generic [ref=e25]:
          - text: Quality Care India Limited
          - generic [ref=e26]:
            - text: (
            - strong [ref=e27]: QCIL
            - text: ) into Aster DM Healthcare Limited (
            - strong [ref=e28]: Aster
            - text: ) by way of scheme of amalgamation, post which Aster will be renamed as Aster DM Quality Care Limited. Prior to the merger, Aster shall purchase 5.0% stake in QCIL from BCP Asia II TopCo IV Pte. Ltd. (
            - strong [ref=e29]: BCP Asia
            - text: ) and Centella Mauritius Holdings Limited (
            - strong [ref=e30]: Centella
            - text: ) in consideration of a primary share issuance by Aster. The existing shareholders of QCIL
            - emphasis [ref=e31]: i.e.
            - text: ", Centella, BCP and certain minority shareholders are proposed to hold certain stake in the merged entity with Centella holding less than 10% stake, without any control rights."
      - paragraph [ref=e32]:
        - generic [ref=e34]: Aster is a healthcare service provider operating in India through 19 hospitals with 4867 beds, 13 clinics, 215 pharmacies, and 232 labs and patient
        - generic [ref=e36]: experience centers across 6 states in India. It is a part of the Aster Group.
      - paragraph [ref=e37]:
        - generic [ref=e39]: BCP is owned by funds advised and / or managed by affiliates of Blackstone Inc.
      - paragraph [ref=e40]:
        - generic [ref=e43]:
          - text: Centella is owned and controlled by an entity, which is advised by the affiliates of TPG Inc. (
          - strong [ref=e44]: TPG
          - text: ), the ultimate holding company of the TPG group. TPG, including its subsidiaries and affiliates, are together referred to as ‘TPG Group’.
      - paragraph [ref=e45]:
        - generic [ref=e47]: QCIL, is an unlisted public limited company, owned and controlled by Centella, and BCP. It operates a network of multi-specialty hospitals under the brand name CARE Hospitals, KIMS Health and Evercare across various cities in India. It has a network of 26 healthcare centers operating over 5,150+ beds across 14 cities offer over 30 medical specialties with a team of 2,500+ doctors.
      - paragraph [ref=e48]:
        - generic [ref=e50]: Detailed order of the Commission will follow.
