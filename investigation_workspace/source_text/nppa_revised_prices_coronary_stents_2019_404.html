<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        .error-code {
            font-size: 120px;
            color: #2b6cb0;
            font-weight: bold;
        }

        .title {
            font-size: 28px;
            margin: 10px 0;
        }

        .message {
            color: #555;
            margin-bottom: 20px;
        }

        .btn {
            text-decoration: none;
            background: #2b6cb0;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .btn:hover {
            background: #1e4e8c;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="error-code">404</div>
    <div class="title">Oops! Page Not Found</div>
    <div class="message">
        The page you are looking for might have been removed or is temporarily unavailable.
    </div>

    <a href="https://nppa.gov.in" class="btn">Go Back Home</a>
</div>

</body>
</html>
